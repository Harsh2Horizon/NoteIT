server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth http://auth:8081;
    set $backend http://backend:8082;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; connect-src 'self'" always;
    add_header Cache-Control no-store always;
    # Do not log URLs containing share tokens.
    access_log off;

    location = /healthz { return 200 'ok'; }
    location /api/auth/ {
        proxy_pass $auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Internal-Key "";
    }
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Internal-Key "";
    }
    location /internal/ { return 404; }
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
