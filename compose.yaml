name: noteit

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make init first}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Run make init first}
      NOTES_DB_PASSWORD: ${NOTES_DB_PASSWORD:?Run make init first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/01-noteit.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27.4
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  auth:
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: auth
    environment:
      DATABASE_URL: postgres://noteit_auth:${AUTH_DB_PASSWORD:?Run make init first}@postgres:5432/noteit_auth?sslmode=disable
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Run make init first}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-hello@noteit.local}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.service
      args:
        SERVICE: backend
    environment:
      DATABASE_URL: postgres://noteit_notes:${NOTES_DB_PASSWORD:?Run make init first}@postgres:5432/noteit_notes?sslmode=disable
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Run make init first}
      APP_URL: ${APP_URL:-http://localhost:8080}
      AUTH_URL: http://auth:8081
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    depends_on:
      auth:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt: [no-new-privileges:true]

volumes:
  postgres_data:
